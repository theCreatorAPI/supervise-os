<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Supervise OS">
  <!--
    The app mark: concentric radar sweep on the brand's moss green, echoing the
    Radar glyph used in the sidebar and auth pages. Drawn as one SVG so it stays
    crisp at every size a browser asks for, from a 16px tab to a bookmark tile.
  -->
  <rect width="64" height="64" rx="15" fill="#4f5f31"/>
  <g fill="none" stroke="#f0f4e8" stroke-linecap="round">
    <circle cx="32" cy="32" r="18.5" stroke-width="3.5" opacity="0.42"/>
    <circle cx="32" cy="32" r="11" stroke-width="3.5" opacity="0.72"/>
    <!-- Sweep arm, pointing up-right like the lucide glyph -->
    <path d="M32 32 L45.5 18.5" stroke-width="4"/>
  </g>
  <circle cx="32" cy="32" r="4" fill="#f0f4e8"/>
</svg>
